---
# Example inventory with placeholder names only. The real inventory lives in AWX.
all:
  children:
    # netbox_ip_sync: one node per Proxmox cluster is enough; the play reads the whole cluster through it.
    proxmox:
      hosts:
        pve01.lab.example.com:
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
    # grow_root_fs: Linux VMs, reached as the admin user proxmox-deploy's cloud-init creates (sudo, no password).
    linux:
      vars:
        ansible_user: ansible
      hosts:
        web-01.lab.example.com:
        db-01.lab.example.com:

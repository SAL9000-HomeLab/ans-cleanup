---
# yamllint configuration (run by CI via the shared ansible-ci and lint-yaml workflows).
# Managed by ans-template: change it there and sync (see ans-template/README.md).
extends: default

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  comments:
    min-spaces-from-content: 1

  comments-indentation: false

  braces:
    max-spaces-inside: 1

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  truthy:
    ignore: |
      .github/workflows/*.yml

ignore: |
  .git/
  .ansible/
  .venv/
  local/
  molecule/*/vault.yml
  **/.tox/
  **/site-packages/
